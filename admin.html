<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Movie Time - פאנל ניהול מתקדם</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Heebo', sans-serif; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; min-height: 100vh; background-color: #08080a; color: #f3f4f6; overflow-x: hidden; position: relative; }
        
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .glow-1 { position: fixed; width: 400px; height: 400px; background: rgba(225, 29, 72, 0.15); border-radius: 50%; filter: blur(140px); top: -50px; right: -50px; z-index: 2; pointer-events: none; }
        .glow-2 { position: fixed; width: 400px; height: 400px; background: rgba(30, 58, 138, 0.12); border-radius: 50%; filter: blur(140px); bottom: -50px; left: -50px; z-index: 2; pointer-events: none; }

        main { position: relative; z-index: 10; width: 100%; max-width: 1000px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 24px; min-height: 100vh; }

        /* Header */
        .admin-header { display: flex; justify-content: space-between; align-items: center; background: rgba(18, 18, 24, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 16px 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .admin-title { font-size: 20px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 10px; }
        .btn-back { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; padding: 8px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s; }
        .btn-back:hover { background: rgba(255, 255, 255, 0.12); }

        /* Content Layout */
        .admin-grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
        @media(min-width: 768px) { .admin-grid { grid-template-columns: 1.2fr 0.8fr; } }

        .glass-box { background: rgba(18, 18, 24, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        
        h2 { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 10px; }

        .form-group { margin-bottom: 14px; text-align: right; }
        label { font-size: 12px; color: #9ca3af; display: block; margin-bottom: 5px; font-weight: 500; }
        .custom-input, .custom-select { width: 100%; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 14px; padding: 12px 16px; color: #fff; font-size: 13px; outline: none; transition: all 0.3s; }
        .custom-input:focus, .custom-select:focus { border-color: #e11d48; box-shadow: 0 0 14px rgba(225, 29, 72, 0.3); background: rgba(255,255,255,0.07); }
        .custom-select option { background: #121218; color: #fff; }

        .btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, #e11d48, #be123c); border: none; border-radius: 14px; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.3s; box-shadow: 0 6px 20px rgba(225, 29, 72, 0.4); margin-top: 10px; }
        .btn-submit:hover { box-shadow: 0 8px 25px rgba(225, 29, 72, 0.6); transform: translateY(-1px); }

        .success-banner { background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.3); color: #86efac; font-size: 13px; padding: 12px; border-radius: 12px; margin-bottom: 16px; display: none; text-align: center; font-weight: 600; }

        /* Live Preview Card */
        .preview-card { background: rgba(18, 18, 24, 0.9); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; max-width: 260px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .preview-poster { width: 100%; height: 260px; background: rgba(255,255,255,0.03); background-size: cover; background-position: center; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; color: #6b7280; font-size: 12px; }
        .preview-info { padding: 14px; display: flex; flex-direction: column; gap: 6px; text-align: right; }
        .preview-title { font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .preview-desc { font-size: 11px; color: #9ca3af; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }

        /* Existing Movies List Manager */
        .movies-list-admin { display: flex; flex-direction: column; gap: 10px; max-height: 450px; overflow-y: auto; padding-left: 4px; }
        .admin-movie-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); padding: 10px 14px; border-radius: 12px; gap: 10px; }
        .admin-movie-details { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .admin-movie-thumb { width: 40px; height: 40px; border-radius: 8px; background-size: cover; background-position: center; flex-shrink: 0; }
        .admin-movie-name { font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-delete { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s; flex-shrink: 0; }
        .btn-delete:hover { background: #ef4444; color: #fff; }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <main>
        <!-- Header -->
        <header class="admin-header">
            <div class="admin-title">
                <span>🎬</span> פאנל ניהול תוכן ראשי
            </div>
            <a href="after.log" class="btn-back">← חזרה למסך צפייה</a>
        </header>

        <div id="success-alert" class="success-banner">הסרט הועלה בהצלחה ומנוהל כעת בענן! 🚀</div>

        <div class="admin-grid">
            <!-- Left Side: Add Movie Form -->
            <div class="glass-box">
                <h2>➕ הוספת סרט חדש</h2>
                <form onsubmit="addNewMovie(event)">
                    <div class="form-group">
                        <label>שם הסרט</label>
                        <input type="text" id="movie-title" class="custom-input" placeholder="למשל: בין כוכבים" oninput="updatePreview()" required>
                    </div>
                    <div class="form-group">
                        <label>קטגוריה</label>
                        <select id="movie-category" class="custom-select">
                            <option value="פעולה">פעולה</option>
                            <option value="קומדיה">קומדיה</option>
                            <option value="פשע">פשע</option>
                            <option value="דוקומנטרי">דוקומנטרי</option>
                            <option value="אימה">אימה</option>
                            <option value="אנימציה">אנימציה</option>
                            <option value="מדע בדיוני">מדע בדיוני</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>שנת הוצאה</label>
                        <input type="number" id="movie-year" class="custom-input" placeholder="2024" required>
                    </div>
                    <div class="form-group">
                        <label>תיאור קצר</label>
                        <input type="text" id="movie-desc" class="custom-input" placeholder="תקציר קצר על הסרט..." oninput="updatePreview()" required>
                    </div>
                    <div class="form-group">
                        <label>קישור לתמונת פוסטר (Image URL)</label>
                        <input type="url" id="movie-poster" class="custom-input" placeholder="הדבק כאן קישור לתמונה מ-ImgBB או רשת" oninput="updatePreview()" required>
                    </div>
                    <div class="form-group">
                        <label>קישור לוידאו צפייה (MP4 Video URL)</label>
                        <input type="url" id="movie-video" class="custom-input" placeholder="https://.../video.mp4" required>
                    </div>

                    <button type="submit" class="btn-submit">פרסם סרט למערכת 🎬</button>
                </form>
            </div>

            <!-- Right Side: Live Preview & Existing Movies Manager -->
            <div style="display: flex; flex-direction: column; gap: 24px;">
                <div class="glass-box">
                    <h2>👁️ תצוגה מקדימה לכרטיס</h2>
                    <div class="preview-card">
                        <div id="preview-img" class="preview-poster">אין תמונה</div>
                        <div class="preview-info">
                            <div id="preview-title-txt" class="preview-title">שם הסרט</div>
                            <div id="preview-desc-txt" class="preview-desc">כאן יופיע תיאור הסרט הקצר...</div>
                        </div>
                    </div>
                </div>

                <div class="glass-box" style="flex: 1;">
                    <h2>🗑️ ניהול סרטים קיימים בענן</h2>
                    <div id="admin-movies-list" class="movies-list-admin">
                        <div style="color: #9ca3af; font-size: 12px; text-align: center; padding: 20px;">טוען סרטים...</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCNoQaVIpyFuOOuGe6n31qiZ-E2SlD0kFg",
          authDomain: "movie-time-7f4ed.firebaseapp.com",
          projectId: "movie-time-7f4ed",
          storageBucket: "movie-time-7f4ed.firebasestorage.app",
          messagingSenderId: "469566511820",
          appId: "1:469566511820:web:e9f13b5c27b9e6b6800069",
          measurementId: "G-0GKDD2P2BE"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Live preview update
        function updatePreview() {
            const title = document.getElementById('movie-title').value.trim();
            const desc = document.getElementById('movie-desc').value.trim();
            const poster = document.getElementById('movie-poster').value.trim();

            document.getElementById('preview-title-txt').innerText = title || 'שם הסרט';
            document.getElementById('preview-desc-txt').innerText = desc || 'כאן יופיע תיאור הסרט הקצר...';
            
            const posterBox = document.getElementById('preview-img');
            if (poster) {
                posterBox.style.backgroundImage = `url('${poster}')`;
                posterBox.innerText = '';
            } else {
                posterBox.style.backgroundImage = 'none';
                posterBox.innerText = 'אין תמונה';
            }
        }

        // Fetch movies for management list
        db.collection("movies").onSnapshot((snapshot) => {
            const listEl = document.getElementById('admin-movies-list');
            listEl.innerHTML = '';

            if (snapshot.empty) {
                listEl.innerHTML = `<div style="color: #9ca3af; font-size: 12px; text-align: center; padding: 20px;">אין סרטים במערכת כרגע.</div>`;
                return;
            }

            snapshot.forEach((doc) => {
                const m = doc.data();
                const id = doc.id;
                listEl.innerHTML += `
                    <div class="admin-movie-item">
                        <div class="admin-movie-details">
                            <div class="admin-movie-thumb" style="background-image: url('${m.posterUrl}');"></div>
                            <div class="admin-movie-name">${m.title}</div>
                        </div>
                        <button class="btn-delete" onclick="deleteMovie('${id}')">מחק</button>
                    </div>
                `;
            });
        });

        // Add Movie to Firestore
        function addNewMovie(e) {
            e.preventDefault();
            
            const newMovie = {
                title: document.getElementById('movie-title').value.trim(),
                category: document.getElementById('movie-category').value,
                year: parseInt(document.getElementById('movie-year').value),
                desc: document.getElementById('movie-desc').value.trim(),
                posterUrl: document.getElementById('movie-poster').value.trim(),
                videoUrl: document.getElementById('movie-video').value.trim(),
                views: Math.floor(Math.random() * 5000) + 500,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection("movies").add(newMovie)
                .then(() => {
                    const alertEl = document.getElementById('success-alert');
                    alertEl.style.display = 'block';
                    setTimeout(() => { alertEl.style.display = 'none'; }, 4000);
                    e.target.reset();
                    updatePreview();
                })
                .catch((error) => {
                    alert("שגיאה בהעלאת הסרט: " + error.message);
                });
        }

        // Delete Movie from Firestore
        function deleteMovie(id) {
            if (confirm("האם אתה בטוח שברצונך למחוק סרט זה מהמערכת?")) {
                db.collection("movies").doc(id).delete().catch((error) => {
                    alert("שגיאה במחיקת הסרט: " + error.message);
                });
            }
        }

        // Canvas Background Animation
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let w, h, particles = [];
        function initCanvas() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 30; i++) {
                particles.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.5 + 0.5, vx: (Math.random() - 0.5) * 0.2, vy: (Math.random() - 0.5) * 0.2, alpha: Math.random() * 0.5 + 0.2 });
            }
        }
        function animateCanvas() {
            ctx.clearRect(0, 0, w, h);
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0) p.x = w; if (p.x > w) p.x = 0; if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`; ctx.fill();
            });
            requestAnimationFrame(animateCanvas);
        }
        window.addEventListener('resize', initCanvas);
        window.onload = () => { initCanvas(); animateCanvas(); };
    </script>
</body>
</html>
