    <!-- Firebase SDKs & Auth Logic (Fixed for Mobile Redirect) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCNoQaVIpyFuOOuGe6n31qiZ-E2SlD0kFg",
          authDomain: "movie-time-7f4ed.firebaseapp.com",
          projectId: "movie-time-7f4ed",
          storageBucket: "movie-time-7f4ed.firebasestorage.app",
          messagingSenderId: "469566511820",
          appId: "1:469566511820:web:e9f13b5c27b9e6b6800069",
          measurementId: "G-0GKDD2P2BE"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let activePlan = '6months';
        let userDetails = { name: 'Op', email: 'user@movietime.com' };

        window.showScreen = function(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        };

        // בדיקה האם המשתמש חזר בהצלחה מדף ההתחברות של גוגל
        getRedirectResult(auth)
            .then((result) => {
                if (result) {
                    const user = result.user;
                    userDetails.name = user.displayName || 'משתמש Google';
                    userDetails.email = user.email || 'user@gmail.com';
                    showScreen('screen-plans');
                }
            }).catch((error) => {
                console.error("שגיאה בחזרת ההתחברות:", error);
            });

        // התחברות באמצעות מעבר עמוד (מונע חסימת פופ-אפ בנייד)
        window.handleGoogleAuth = async function() {
            try {
                await signInWithRedirect(auth, provider);
            } catch (error) {
                console.error("שגיאה בהתחברות Google:", error);
                alert("התחברות Google נכשלה: " + error.message);
            }
        };

        window.handleEmailLogin = function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            userDetails.name = email.split('@')[0];
            userDetails.email = email;
            showScreen('screen-plans');
        };

        window.handleRegisterSubmit = function(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            userDetails.name = name;
            userDetails.email = email;
            showScreen('screen-plans');
        };

        window.selectPlan = function(planId) {
            activePlan = planId;
            document.querySelectorAll('.plan-card').forEach(c => c.classList.remove('selected'));
            document.getElementById(`plan-${planId}`).classList.add('selected');
        };

        window.confirmPlanChoice = function() {
            const planTitles = {
                '2months': '2 חודשים (₪59)',
                '6months': '6 חודשים (₪149)',
                'freetrial': 'Free Trial (חודש 1 חינם)'
            };

            document.getElementById('dash-user-name').innerText = userDetails.name;
            document.getElementById('dash-user-email').innerText = userDetails.email;
            document.getElementById('dash-plan-name').innerText = planTitles[activePlan];

            if (activePlan === 'freetrial') {
                showScreen('screen-dashboard');
            } else {
                showScreen('screen-paid-block');
            }
        };

        window.logoutUser = async function() {
            try {
                await signOut(auth);
            } catch(e) {}
            showScreen('screen-login');
        };

        // Particle Canvas Background
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let w, h, particles = [];

        function initCanvas() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    r: Math.random() * 1.5 + 0.5,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    alpha: Math.random() * 0.6 + 0.2
                });
            }
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, w, h);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0) p.x = w;
                if (p.x > w) p.x = 0;
                if (p.y < 0) p.y = h;
                if (p.y > h) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                ctx.fill();
            });
            requestAnimationFrame(animateCanvas);
        }

        window.addEventListener('resize', initCanvas);
        window.onload = () => {
            initCanvas();
            animateCanvas();
        };
    </script>
